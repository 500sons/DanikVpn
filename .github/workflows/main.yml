name: Build DanikVpn APK from ZIP

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract target ZIP archive
        run: |
          TARGET_ZIP=$(find . -not -path '*/.*' -type f -name "danikvpn-with-default-config.zip" -print -quit)

          if [ -n "$TARGET_ZIP" ]; then
            echo "Найден целевой архив: $TARGET_ZIP"
            ZIP_TO_EXTRACT="$TARGET_ZIP"
          else
            mapfile -t ZIPS < <(find . -not -path '*/.*' -type f -name "*.zip")
            COUNT=${#ZIPS[@]}

            if [ "$COUNT" -eq 1 ]; then
              ZIP_TO_EXTRACT="${ZIPS[0]}"
              echo "Найден единственный архив: $ZIP_TO_EXTRACT"
            elif [ "$COUNT" -gt 1 ]; then
              echo "Ошибка: найдено несколько .zip архивов ($COUNT): ${ZIPS[*]}"
              exit 1
            else
              ZIP_TO_EXTRACT=""
            fi
          fi

          if [ -n "$ZIP_TO_EXTRACT" ]; then
            mkdir -p extracted_project
            unzip -q "$ZIP_TO_EXTRACT" -d extracted_project
            SEARCH_ROOT="extracted_project"
          else
            SEARCH_ROOT="."
          fi

          SETTINGS_FILE=$(find "$SEARCH_ROOT" -maxdepth 4 \( -name "settings.gradle.kts" -o -name "settings.gradle" \) -print -quit)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "Ошибка: не найден settings.gradle.kts"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

          MANIFEST="$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ] && ! grep -q "PROPERTY_SPECIAL_USE_FGS_SUBTYPE" "$MANIFEST"; then
            sed -i 's|</service>|<property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" android:value="vpn" /></service>|g' "$MANIFEST"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          add-to-path: true

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DanikVpn-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk

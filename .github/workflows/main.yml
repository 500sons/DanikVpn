name: Build DanikVpn APK from ZIP

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract target ZIP archive
        run: |
          TARGET_ZIP=$(find . -not -path '*/.*' -type f -name "danikvpn-with-default-config.zip" -print -quit)

          if [ -n "$TARGET_ZIP" ]; then
            echo "Найден целевой архив: $TARGET_ZIP"
            ZIP_TO_EXTRACT="$TARGET_ZIP"
          else
            mapfile -t ZIPS < <(find . -not -path '*/.*' -type f -name "*.zip")
            COUNT=${#ZIPS[@]}

            if [ "$COUNT" -eq 1 ]; then
              ZIP_TO_EXTRACT="${ZIPS[0]}"
              echo "Найден единственный архив: $ZIP_TO_EXTRACT"
            elif [ "$COUNT" -gt 1 ]; then
              echo "Ошибка: найдено несколько .zip архивов ($COUNT): ${ZIPS[*]}"
              exit 1
            else
              echo "ZIP архив не найден, проверяем распакованный проект..."
              ZIP_TO_EXTRACT=""
            fi
          fi

          if [ -n "$ZIP_TO_EXTRACT" ]; then
            mkdir -p extracted_project
            unzip -q "$ZIP_TO_EXTRACT" -d extracted_project
            SEARCH_ROOT="extracted_project"
          else
            SEARCH_ROOT="."
          fi

          SETTINGS_FILE=$(find "$SEARCH_ROOT" -maxdepth 4 \( -name "settings.gradle.kts" -o -name "settings.gradle" \) -print -quit)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "Ошибка: не найден ни .zip архив, ни файл settings.gradle.kts! Загрузите danikvpn-with-default-config.zip в репозиторий."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Папка проекта для сборки: $PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug & Release APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace
          gradle assembleRelease --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DanikVpn-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: DanikVpn-release-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
